<section class="mb-5">
  <h2 class="h4 mb-3">Look up a public key</h2>
  <form id="sx-lookup-form" class="mb-3">
    <div class="input-group input-group-lg">
      <input type="text" name="identifier" class="form-control"
        placeholder="someone@example.com or 0x11A1A9C84B18732F" required>
      <button type="submit" class="btn btn-primary">Look up</button>
    </div>
  </form>
  <div id="sx-lookup-result"></div>
</section>

<hr class="mb-5">

<section>
  <h2 class="h4 mb-3">Upload a public key</h2>
  <form id="sx-upload-form">
    <textarea class="form-control sx-mono mb-3" name="publicKeyArmored" rows="8" spellcheck="false"
      placeholder="Paste PGP PUBLIC KEY BLOCK here …" required></textarea>
    <button type="submit" class="btn btn-primary btn-lg">Upload</button>
  </form>
</section>
