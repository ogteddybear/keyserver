<nav class="nav nav-pills justify-content-end mb-4">
  <a class="nav-link" href="/">Home</a>
  <a class="nav-link" href="/manage.html">Manage Keys</a>
  <a class="nav-link" href="https://github.com/ogteddybear/keyserver" target="_blank" rel="noopener">GitHub</a>
</nav>

<div class="card bg-body-secondary border">
  <div class="card-body">
    <h4 class="h6 text-uppercase text-secondary mb-3">
      <%= query.email ? `Email: ${query.email}` : query.fingerprint ? `Fingerprint: ${query.fingerprint}` : `Key ID: ${query.keyId}` %>
    </h4>
    <pre id="sx-armored-key" class="sx-mono mb-3"><%= key.publicKeyArmored %></pre>
    <button type="button" id="sx-copy-armored" class="btn btn-outline-primary btn-sm">Copy key</button>
  </div>
</div>

<%- include('footer.html') %>

<script>
  document.getElementById('sx-copy-armored')?.addEventListener('click', async (e) => {
    await navigator.clipboard.writeText(document.getElementById('sx-armored-key').textContent);
    const btn = e.currentTarget;
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
</script>
